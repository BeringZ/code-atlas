<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Code Atlas 2.0 功能实验室：从需求出发实现同一功能，连接多个知识点并可切换语言。" />
  <title>Code Atlas 2.0 · 功能实验室</title>
  <link rel="stylesheet" href="atlas.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">&lt;/&gt;</span>
      <span><strong>Code Atlas</strong><span>2.0 · 功能实验室</span></span>
    </a>
    <label class="search-box">
      <span class="search-icon">⌕</span>
      <input id="globalSearch" type="search" placeholder="搜索任务、知识点…" />
      <kbd>/</kbd>
    </label>
    <div class="search-results hidden" id="searchResults"></div>
    <div class="topbar-actions">
      <button class="ghost-button" onclick="location.href='modules.html'">基础模块</button>
      <button class="ghost-button" onclick="location.href='language.html'">语言进阶</button>
      <button class="icon-button" id="themeToggle" aria-label="切换主题">◐</button>
    </div>
  </header>

  <main class="content">
    <section class="page-hero">
      <div class="eyebrow">Feature lab</div>
      <h1>功能实验室</h1>
      <p>从需求出发实现同一个功能：需求拆解 → 连接知识点 → 分阶段实现 → 验收测试 → 设计权衡。每个任务绑定一门主语言，并给出其他语言的实现对照。</p>
    </section>

    <div class="lab-layout" id="labRoot"></div>

    <footer class="page-footer">
      <span>功能实验室 · 综合多个知识点</span>
      <span>先独立完成，再对照思路提示</span>
    </footer>
  </main>

  <div class="toast" role="status"></div>

  <script src="concept-data.js"></script>
  <script src="concepts-supplement.js"></script>
  <script src="lab-data.js"></script>
  <script src="atlas.js"></script>
  <script src="lab.js"></script>
</body>
</html>
