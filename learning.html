<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Code Atlas 进阶学习：按编程语言分类的高质量进阶教程，来源权威、链接已验证。" />
  <title>Code Atlas · 进阶学习</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="learning.css" />
</head>
<body>
  <div class="app-shell learning-shell">
    <header class="topbar learning-topbar">
      <div class="breadcrumb">
        <a class="learning-home" href="index.html" aria-label="返回主站">
          <span class="brand-mark small">&lt;/&gt;</span>
        </a>
        <span>进阶学习</span>
        <b>/</b>
        <strong id="crumbLanguage">Python</strong>
      </div>

      <div class="topbar-actions">
        <a class="ghost-button" href="index.html">← 返回主站</a>
        <button class="icon-button" id="themeToggle" aria-label="切换主题">◐</button>
      </div>
    </header>

    <nav class="language-tabs" id="languageTabs" aria-label="语言选择"></nav>

    <main class="content learning-content">
      <section class="hero learning-hero">
        <div>
          <div class="eyebrow" id="learningEyebrow">Advanced learning paths</div>
          <h1 id="learningTitle"></h1>
          <p id="learningSubtitle"></p>
        </div>
        <div class="learning-stats" id="learningStats"></div>
      </section>

      <section id="categorySections" class="learning-sections"></section>

      <footer class="page-footer">
        <a class="ghost-button" href="index.html">← 返回主站</a>
        <span>教程来自官方文档与权威平台 · 链接已验证</span>
        <button class="primary-button" id="backToTop">回到顶部 ↑</button>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="learning-data.js"></script>
  <script src="learning.js"></script>
</body>
</html>
