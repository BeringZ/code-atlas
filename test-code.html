<!doctype html>
<html>
<head><meta charset="UTF-8"><title>Code Atlas Test</title>
<style>
  .code-card { background: #111315; border-radius: 15px; }
  pre { margin: 0; padding: 22px; }
  code { color: #e8ecef; font: 12.5px/1.7 monospace; white-space: pre; }
</style>
</head>
<body>
<h2>Code output test</h2>
<article class="code-card">
  <pre><code id="codeBlock">[LOADING...]</code></pre>
</article>
<script>
window.onerror = (msg, url, line) => {
  document.getElementById('codeBlock').textContent = 'ERROR: ' + msg + ' at line ' + line;
};
</script>
<script src="data.js"></script>
<script>
try {
  const ch = window.CODE_ATLAS_DATA.chapters[0];
  const snip = ch.snippets.python;
  document.getElementById('codeBlock').innerHTML = snip.code || 'empty code';
  console.log('OK:', snip.code.substring(0, 50));
} catch(e) {
  document.getElementById('codeBlock').textContent = 'RUNTIME ERROR: ' + e.message + ' ' + e.stack;
}
</script>
</body>
</html>
